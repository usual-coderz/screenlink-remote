name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options:
          - release
          - debug
        default: release
        required: true

      app_id:
        description: "applicationId (blank = builder.properties se)"
        type: string
        default: ""
        required: false

      app_name:
        description: "App label (blank = builder.properties se)"
        type: string
        default: ""
        required: false

      base_url:
        description: "API base URL (blank = builder.properties se)"
        type: string
        default: ""
        required: false

  push:
    branches:
      - main
      - master
    paths-ignore:
      - "backend/**"
      - "admin/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve build variant
        shell: bash
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail

          VARIANT="${INPUT_VARIANT:-release}"

          case "$VARIANT" in
            release|debug) ;;
            *) VARIANT="release" ;;
          esac

          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "Resolved variant: $VARIANT"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK not found at $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed"
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      # Temporary workaround for the unrecognized wrapper JAR.
      # Re-enable validation after verifying and repairing the template wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          for f in settings.gradle settings.gradle.kts build.gradle build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "ok: $f"
            fi
          done

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle(.kts) missing"
            fail=1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle(.kts) missing"
            fail=1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml missing"
            fail=1
          fi

          if [ ! -f builder.properties ]; then
            echo "::error::builder.properties missing"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "Project structure verified"

      - name: Apply workflow inputs to builder.properties
        shell: bash
        env:
          INPUT_APP_ID: ${{ inputs.app_id }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail

          patch() {
            local key="$1"
            local value="$2"
            local escaped

            [ -n "$value" ] || return 0

            escaped=$(printf '%s' "$value" |
              sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')

            if grep -qE "^${key}=" builder.properties; then
              KEY="$key" VALUE="$escaped" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("builder.properties")
          key = os.environ["KEY"]
          value = os.environ["VALUE"]

          lines = path.read_text().splitlines()
          replaced = False
          output = []

          for line in lines:
              if line.startswith(key + "="):
                  output.append(f"{key}={value}")
                  replaced = True
              else:
                  output.append(line)

          if not replaced:
              output.append(f"{key}={value}")

          path.write_text("\n".join(output) + "\n")
          PY
            else
              printf '%s=%s\n' "$key" "$escaped" >> builder.properties
            fi
          }

          patch appId "$INPUT_APP_ID"
          patch appName "$INPUT_APP_NAME"
          patch baseUrl "$INPUT_BASE_URL"

          echo "Builder properties updated"
          echo "Sensitive values, if any, are not printed."

      - name: Prepare Gradle environment
        shell: bash
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PROPERTIES
          fi

      - name: Prepare release signing
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          ALIAS="${KEY_ALIAS:-tpc-release}"
          STOREPASS="${STORE_PASSWORD:-tpcbuild123}"
          KEYPASS="${KEY_PASSWORD:-$STOREPASS}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" |
              base64 --decode > app-keystore.jks

            [ -s app-keystore.jks ] || {
              echo "::error::Keystore is empty"
              exit 1
            }

            keytool -list \
              -keystore app-keystore.jks \
              -storepass "$STOREPASS" >/dev/null

            MODE="secrets"
          else
            keytool -genkeypair \
              -keystore app-keystore.jks \
              -storetype JKS \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -dname "CN=TPC Release,OU=Mobile,O=TPC,L=NA,ST=NA,C=IN" \
              -noprompt

            MODE="generated"
          fi

          {
            echo "storeFile=app-keystore.jks"
            echo "storeType=JKS"
            echo "storePassword=$STOREPASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEYPASS"
          } > keystore.properties

          echo "SIGN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Release signing prepared: $MODE"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -x ./gradlew ]; then
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          case "$VARIANT" in
            debug)
              TASK="assembleDebug"
              ;;
            release)
              TASK="assembleRelease"
              ;;
            *)
              echo "::error::Unsupported build variant: $VARIANT"
              exit 1
              ;;
          esac

          echo "Running: $GRADLE $TASK"

          "$GRADLE" "$TASK" \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Dump outputs on failure
        if: failure()
        shell: bash
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f 2>/dev/null || true

          echo "Gradle reports:"
          find app/build/reports -type f 2>/dev/null || true

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/$VARIANT"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              ! -name "*-unsigned.apk" |
              sort |
              head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::No installable APK found"
            find "$APK_DIR" -type f 2>/dev/null || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

          echo "APK: $APK"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPC-APK-${{ env.VARIANT }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        env:
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          {
            echo "## APK Build"
            echo
            echo "- Variant: ${VARIANT:-unknown}"
            echo "- Signing: ${SIGN_MODE:-n/a}"
            echo "- Size: ${APK_SIZE:-n/a} bytes"
            echo "- SHA-256: \`${APK_SHA:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No root requirements.txt; skipping dependency installation."
          fi

      - name: Import backend
        shell: bash
        run: |
          set -euo pipefail
          python -c "import backend.app; print('backend.app import ok')"
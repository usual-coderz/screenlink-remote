name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options:
          - release
          - debug
        default: release
        required: true

  push:
    branches:
      - main
    paths-ignore:
      - "backend/**"
      - "admin/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore configured."
            echo "Using the signing configuration defined in build.gradle.kts."
            exit 0
          fi

          if [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Signing secrets are incomplete."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app-keystore.jks

          if [ ! -s app-keystore.jks ]; then
            echo "Error: Keystore file is empty or invalid."
            exit 1
          fi

          cat > keystore.properties <<EOF
          storeFile=app-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "Release signing configuration prepared."

      - name: Build APK
        env:
          VARIANT: ${{ github.event.inputs.variant || 'release' }}
        run: |
          set -e

          case "$VARIANT" in
            debug)
              gradle assembleDebug --no-daemon --console=plain
              ;;
            release)
              gradle assembleRelease --no-daemon --console=plain
              ;;
            *)
              echo "Error: Unsupported build variant: $VARIANT"
              exit 1
              ;;
          esac

      - name: Locate APK
        id: apk
        env:
          VARIANT: ${{ github.event.inputs.variant || 'release' }}
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/$VARIANT"

          if [ ! -d "$APK_DIR" ]; then
            echo "Error: APK output directory not found: $APK_DIR"
            find app/build/outputs -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi

          APK=$(find "$APK_DIR" -type f -name "*.apk" \
            ! -name "*-unsigned.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Error: No signed APK found."
            find "$APK_DIR" -type f 2>/dev/null || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

          echo "APK found: $APK"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DESI-VIDEOS-APK-${{ github.event.inputs.variant || 'release' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        env:
          VARIANT: ${{ github.event.inputs.variant || 'release' }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          {
            echo "## APK Build Successful"
            echo ""
            echo "- Variant: \`$VARIANT\`"
            echo "- Size: $APK_SIZE bytes"
            echo "- SHA-256: \`$APK_SHA\`"
            echo ""
            echo "Download the APK from the workflow run's Artifacts section."
          } >> "$GITHUB_STEP_SUMMARY"
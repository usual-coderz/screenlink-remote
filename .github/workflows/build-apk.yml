name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        options:
          - release
          - debug
        default: release
        required: true

      app_id:
        description: "applicationId (blank = builder.properties)"
        type: string
        default: ""
        required: false

      app_name:
        description: "App label (blank = builder.properties)"
        type: string
        default: ""
        required: false

      base_url:
        description: "API base URL (blank = builder.properties)"
        type: string
        default: ""
        required: false

  push:
    branches:
      - main
      - master
    paths-ignore:
      - "backend/**"
      - "admin/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve build variant
        shell: bash
        env:
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail

          VARIANT="${INPUT_VARIANT:-release}"

          case "$VARIANT" in
            debug|release) ;;
            *)
              echo "::error::Unsupported variant: $VARIANT"
              exit 1
              ;;
          esac

          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          echo "Building variant: $VARIANT"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME" || {
            echo "::error::Android SDK not found"
            exit 1
          }

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed"
            exit 1
          fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      # Temporary workaround only.
      # Verify and repair every wrapper JAR before re-enabling validation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f builder.properties || {
            echo "::error::builder.properties missing"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml missing"
            exit 1
          }

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::settings.gradle(.kts) missing"
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle(.kts) missing"
            exit 1
          fi

          echo "Android project structure verified"

      - name: Apply workflow inputs
        shell: bash
        env:
          INPUT_APP_ID: ${{ inputs.app_id }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("builder.properties")
          lines = path.read_text().splitlines()

          updates = {
              "appId": os.environ.get("INPUT_APP_ID", ""),
              "appName": os.environ.get("INPUT_APP_NAME", ""),
              "baseUrl": os.environ.get("INPUT_BASE_URL", ""),
          }

          for key, value in updates.items():
              if not value:
                  continue

              value = value.replace("\\", "\\\\").replace(":", "\\:")
              prefix = key + "="
              found = False
              output = []

              for line in lines:
                  if line.startswith(prefix):
                      if not found:
                          output.append(prefix + value)
                          found = True
                  else:
                      output.append(line)

              if not found:
                  output.append(prefix + value)

              lines = output

          path.write_text("\n".join(lines) + "\n")
          print("Builder properties updated.")
          PY

      - name: Prepare Gradle environment
        shell: bash
        run: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PROPERTIES
          fi

      - name: Prepare release signing
        if: env.VARIANT == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          ALIAS="${KEY_ALIAS:-tpc-release}"
          STOREPASS="${STORE_PASSWORD:-tpcbuild123}"
          KEYPASS="${KEY_PASSWORD:-$STOREPASS}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" |
              base64 --decode > app-keystore.jks

            test -s app-keystore.jks || {
              echo "::error::Keystore is empty"
              exit 1
            }

            keytool -list \
              -keystore app-keystore.jks \
              -storepass "$STOREPASS" >/dev/null

            MODE="secrets"
          else
            keytool -genkeypair \
              -keystore app-keystore.jks \
              -storetype JKS \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -dname "CN=TPC Release,OU=Mobile,O=TPC,L=NA,ST=NA,C=IN" \
              -noprompt

            MODE="generated"
          fi

          {
            echo "storeFile=app-keystore.jks"
            echo "storeType=JKS"
            echo "storePassword=$STOREPASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEYPASS"
          } > keystore.properties

          echo "SIGN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Release signing prepared: $MODE"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -x ./gradlew ]; then
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          case "$VARIANT" in
            debug) TASK="assembleDebug" ;;
            release) TASK="assembleRelease" ;;
          esac

          "$GRADLE" "$TASK" \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Dump build diagnostics
        if: failure()
        shell: bash
        run: |
          echo "APK outputs:"
          find app/build/outputs -type f 2>/dev/null || true

          echo "Build reports:"
          find app/build/reports -type f 2>/dev/null || true

          echo "Gradle wrapper files:"
          find gradle backend/apk_template/gradle \
            -maxdepth 3 -type f 2>/dev/null || true

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/$VARIANT"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found: $APK_DIR"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              ! -name "*-unsigned.apk" |
              sort |
              head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::No installable APK found"
            find "$APK_DIR" -type f 2>/dev/null || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

          echo "APK found: $APK"

      - name: Verify APK signature
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPC-APK-${{ env.VARIANT }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        env:
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## APK Build"
            echo
            echo "- Variant: ${VARIANT:-unknown}"
            echo "- Signing: ${SIGN_MODE:-n/a}"
            echo "- Size: ${APK_SIZE:-n/a} bytes"
            echo "- SHA-256: \`${APK_SHA:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Node.js backend sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate backend structure
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d backend ]; then
            echo "::error::backend directory not found"
            exit 1
          fi

          if [ ! -f backend/package.json ]; then
            echo "::error::backend/package.json not found"
            exit 1
          fi

          node -e "
            const p = require('./backend/package.json');
            console.log('Backend package:', p.name || 'unnamed');
          "

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "package-lock.json not found; using npm install."
            npm install --no-audit --no-fund
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          COUNT=0

          while IFS= read -r -d '' FILE; do
            echo "Checking: $FILE"
            node --check "$FILE"
            COUNT=$((COUNT + 1))
          done < <(
            find backend \
              -type f \
              -name "*.js" \
              ! -path "*/node_modules/*" \
              -print0
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No JavaScript files found in backend"
            exit 1
          fi

          echo "Validated $COUNT JavaScript files."

      - name: Validate backend entry point
        shell: bash
        run: |
          set -euo pipefail

          if [ -f backend/server.js ]; then
            echo "Backend entry point found: backend/server.js"
          elif [ -f backend/index.js ]; then
            echo "Backend entry point found: backend/index.js"
          else
            echo "::error::Neither backend/server.js nor backend/index.js exists"
            find backend -maxdepth 2 -type f -name "*.js" -print
            exit 1
          fi

      - name: Backend summary
        if: always()
        run: |
          echo "Node.js backend sanity check completed."
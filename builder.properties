# ------------------------------------------------------------------
#  TPC builder.properties
#  Ye file app/build.gradle.kts padhta hai. Repo me default values
#  rehti hain; backend.apk_builder.worker build ke waqt temp copy
#  me apni values likhta hai (appId, appSecret, baseUrl, version...).
#
#  NOTE: Java .properties format hai.
#    - value me backslash \ ho to \\ likho
#    - value me : ya = ho to \: aur \= likho
# ------------------------------------------------------------------

# ---- identity ----------------------------------------------------
# appId hi applicationId banega. Khaali chhodo to default chalega.
appId=com.screenlink.remote
appName=TPC Remote

# ---- version -----------------------------------------------------
versionCode=1
versionName=1.0

# ---- build metadata ---------------------------------------------
# buildId = backend ka build id, APK me debug ke liye embed hota hai
buildId=

# ---- runtime config (resValue + BuildConfig me embed hota hai) ----
# baseUrl = tumhara panel/API ka public URL
baseUrl=
# appSecret = per-app HMAC secret (backend generate karta hai)
appSecret=

# ---- gradle knobs ------------------------------------------------
minify=true
shrinkResources=true